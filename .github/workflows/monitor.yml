name: Cardmaniac + Brack Monitor

on:
  schedule:
    # Alle 10 Minuten (GitHub kann leicht verzögern)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Manuell unter Actions → Run workflow

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          MAIL_TO: mab151204@gmail.com
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Full Brack scan only when sitemap changed (or set to 1 to force)
          FORCE_BRACK_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python monitor.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json seen_brack.json brack_sitemap_state.json
          if git diff --staged --quiet; then
            echo "Keine Änderung an State-Dateien"
          else
            git commit -m "chore: update monitor state"
            git push
          fi
