name: Stock & Pre-Order Monitor

on:
  schedule:
    # Backup only — GitHub delays this heavily; real trigger is external cron
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-monitor]

concurrency:
  group: stock-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FORCE_BRACK_SCAN: "0"
        run: python monitor.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json seen_brack.json brack_sitemap_state.json stock_cardcollectors.json seen_manor.json seen_ryu.json seen_pokecard.json seen_manashop.json seen_sparkleaf.json
          if git diff --staged --quiet; then
            echo "Keine Änderung an State-Dateien"
          else
            git commit -m "chore: update monitor state"
            git push
          fi
